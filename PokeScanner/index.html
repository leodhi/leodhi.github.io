<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Poké Scan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d">
<!--
  The short address https://leodhi.github.io/PokeScanner/ (2026-09-19) used to be a full copy of
  Poké Scan, published by hand from leodhi/claude docs/pokescan/. A copy goes stale (security review
  2026-11-17: the last copy was from 2026-10-06 and still had every fixed weakness), so since then this
  address only sends people on to the one real Poké Scan, his pick ("It should be updated I think",
  then "a page that sends people to the current Poké Scan").
  Everything after the address -- a ?search and the # part, including a Keys app link with its proof
  -- goes along unchanged, so links and keys sent here keep working there. Same site, so the same
  sign-in and the same saved cards. The source is leodhi/claude tools/pokescanner-forward/, published by
  tools/publish-pokescanner.sh.
-->
<script>
  (function () {
    var to = "/claude/docs/pokescan/" + location.search + location.hash;
    try { location.replace(to); } catch (e) { location.href = to; }
  })();
</script>
<style>
  :root { --bg: #f2f2f7; --ink: #1d1b26; --soft: #6b6880; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --ink: #f3f1fa; --soft: #a7a3b8; --card: #1b1826; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 17px/1.4 -apple-system, system-ui, sans-serif; }
  .c { background: var(--card); border-radius: 18px; padding: 28px 22px; max-width: 380px; width: 100%; text-align: center; }
  p { color: var(--soft); margin: 8px 0 0; }
  a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
      background: linear-gradient(135deg, #7c3aed, #db2777); }
</style>
</head>
<body>
<div class="c">
  <strong>Opening Poké Scan…</strong>
  <p>Poké Scan has a new address. If it doesn't open by itself, tap below.</p>
  <a id="go" href="/claude/docs/pokescan/">Open Poké Scan</a>
</div>
<script>document.getElementById("go").href = "/claude/docs/pokescan/" + location.search + location.hash;</script>
</body>
</html>
